<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de Declaração - Claro</title>
    <link rel="stylesheet" href="css/main.css">
    <link rel="icon" href="/logo.png" type="image/png">
</head>
<body>

<main class="container">
    <header>
        <h1>Gerar Declaração de Endereço</h1>
        <p>Preencha os dados abaixo para gerar o documento DOCX.</p>
    </header>

    <form id="declarationForm">
        <div class="form-group">
            <label for="nome">Nome Completo</label>
            <input type="text" id="nome" name="nome" required>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="rg">RG</label>
                <input type="text" id="rg" name="rg" required>
            </div>
            <div class="form-group">
                <label for="cpf">CPF</label>
                <input type="text" id="cpf" name="cpf" required>
            </div>
        </div>

        <hr>

        <div class="form-row">
            <div class="form-group small">
                <label for="cep">CEP</label>
                <input type="text" id="cep" name="cep" maxlength="9" required>
            </div>
            <div class="form-group">
                <button type="button" id="btnBuscarCep">Buscar</button>
            </div>
        </div>

        <div class="form-group">
            <label for="logradouro">Logradouro</label>
            <input type="text" id="logradouro" name="logradouro" required>
        </div>

        <div class="form-row">
            <div class="form-group small">
                <label for="numero">Número</label>
                <input type="text" id="numero" name="numero" required>
            </div>
            <div class="form-group">
                <label for="complemento">Complemento</label>
                <input type="text" id="complemento" name="complemento">
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="bairro">Bairro</label>
                <input type="text" id="bairro" name="bairro" required>
            </div>
            <div class="form-group">
                <label for="cidade_uf">Cidade/UF</label>
                <input type="text" id="cidade_uf" name="cidade_uf" required>
            </div>
        </div>

        <hr>

        <div class="form-group">
            <label for="data">Data da Declaração</label>
            <input type="text" id="data" name="data" placeholder="ex: 05 de Dezembro de 2025" required>
        </div>

        <button type="submit" id="btnGerar">Gerar Documento</button>
    </form>
</main>

<script src="../src/js/viacep.js"></script>
<script src="../src/js/api.js"></script>
<script src="../src/js/main.js"></script>

</body>
</html>
